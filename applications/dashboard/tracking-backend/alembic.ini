# A generic, single database configuration.

[alembic]
# path to migration scripts
# Use forward slashes on all platforms
script_location = alembic

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# Uncomment the line below if you want the files to be prepended with date and time
file_template = %%(year)04d%%(month)02d%%(day)02d_%%(hour)02d%%(minute)02d_%%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename.
# If specified, requires the python>=3.9 or backports.zoneinfo library.
timezone = UTC

# max length of characters to apply to the
# "slug" field
truncate_slug_length = 40

# version location specification; This defaults
# to alembic/versions.  When using multiple version
# directories, initial revisions must be specified with --version-path.
version_locations = %(here)s/alembic/versions

# version path separator; As mentioned above, this is the character used to split
# version_locations. The default within new alembic.ini files is "os", which uses
# os.pathsep. Note that this can only be set in the main section.
version_path_separator = os

# the output encoding used when revision files
# are written from script.py.mako
output_encoding = utf-8

# DATABASE_URL is read from the environment — no URL hardcoded here.
# The env.py reads os.environ["DATABASE_URL"] directly.
sqlalchemy.url = placeholder_overridden_by_env_py

# CRITICAL — this service shares the SAME Postgres database as
# applications/dashboard/backend, but must NEVER share migration bookkeeping
# with it. env.py passes version_table="ft_alembic_version" to
# context.configure() so this chain's applied-revision history is tracked in
# its own table, completely separate from the main backend's "alembic_version"
# table. Without this, running `alembic upgrade head` in either service could
# stamp/read the wrong chain's revision and corrupt the other service's
# migration state.
# (version_table is not a native alembic.ini key — it is enforced in env.py.)


[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts.  See the documentation for further
# detail and examples

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
